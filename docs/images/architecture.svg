<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="650" viewBox="0 0 1440 650" role="img" aria-labelledby="title desc">
  <title id="title">P.R.I.S.M system architecture</title>
  <desc id="desc">Flow features feed preprocessing and XGBoost, local RL, and global federated RL. A Flask dashboard presents predictions. Three local clients send model weights to Flower FedAvg. Operator feedback can update the learner.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#6e8aa2" stroke-width="1.5"/></marker></defs>
  <rect width="1440" height="650" rx="16" fill="#f5f8fc"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="48" y="53" fill="#112e48" font-size="27" font-weight="700">One dashboard, three inference paths</text>
    <text x="48" y="83" fill="#526d84" font-size="17">Supervised detection · local adaptation · federated RL weights</text>
    <g fill="none" stroke="#6e8aa2" stroke-width="2" marker-end="url(#arrow)">
      <path d="M255 255 H307"/>
      <path d="M530 255 H573 V164 H625"/><path d="M530 255 H625"/><path d="M573 255 V346 H625"/>
      <path d="M891 164 H944 V255 H1000"/><path d="M891 255 H1000"/><path d="M891 346 H944 V255"/>
      <path d="M1119 304 V405 H890 V535 H840" stroke-dasharray="7 6"/>
      <path d="M680 490 V395"/>
      <path d="M255 535 H340"/><path d="M255 535 V461 H340"/><path d="M255 535 V599 H340"/>
      <path d="M530 461 H571 V535 H600"/><path d="M530 535 H600"/><path d="M530 599 H571 V535"/>
    </g>
    <rect x="48" y="207" width="207" height="97" rx="12" fill="#e1edf8" stroke="#c0d5e8"/>
    <text x="70" y="240" fill="#173f60" font-size="19" font-weight="700">Flow input</text><text x="70" y="269" fill="#526d84" font-size="16">CSV / capture / vector</text>
    <rect x="307" y="207" width="223" height="97" rx="12" fill="#e1edf8" stroke="#c0d5e8"/>
    <text x="330" y="240" fill="#173f60" font-size="19" font-weight="700">Preprocessing</text><text x="330" y="269" fill="#526d84" font-size="16">42 ordered features</text>
    <rect x="625" y="123" width="266" height="81" rx="12" fill="#ddf5ed" stroke="#a7dccc"/><text x="649" y="155" fill="#155d4b" font-size="20" font-weight="700">XGBoost</text><text x="649" y="182" fill="#416d61" font-size="16">Primary classification</text>
    <rect x="625" y="215" width="266" height="81" rx="12" fill="#e5ebff" stroke="#bdc9ed"/><text x="649" y="247" fill="#304f91" font-size="20" font-weight="700">Local RL models</text><text x="649" y="274" fill="#566b95" font-size="16">Five classifiers + live learner</text>
    <rect x="625" y="307" width="266" height="88" rx="12" fill="#efe6fc" stroke="#d1bce9"/><text x="649" y="340" fill="#69438c" font-size="20" font-weight="700">Global federated RL</text><text x="649" y="368" fill="#7a638e" font-size="16">Saved Dueling DQN weights</text>
    <rect x="1000" y="207" width="375" height="97" rx="12" fill="#112e48"/><text x="1024" y="241" fill="#f5fbff" font-size="22" font-weight="700">Flask dashboard</text><text x="1024" y="270" fill="#c0d5e8" font-size="16">Predictions · XAI · advisor · monitors</text>
    <rect x="48" y="491" width="207" height="88" rx="12" fill="#e1edf8" stroke="#c0d5e8"/><text x="70" y="525" fill="#173f60" font-size="19" font-weight="700">Private shards</text><text x="70" y="552" fill="#526d84" font-size="16">Partitioned locally</text>
    <g fill="#ffffff" stroke="#c0d5e8"><rect x="340" y="435" width="190" height="52" rx="10"/><rect x="340" y="509" width="190" height="52" rx="10"/><rect x="340" y="573" width="190" height="52" rx="10"/></g>
    <g fill="#173f60" font-size="17" font-weight="600"><text x="363" y="467">Client 0 · local RL</text><text x="363" y="541">Client 1 · local RL</text><text x="363" y="605">Client 2 · local RL</text></g>
    <rect x="600" y="490" width="240" height="88" rx="12" fill="#efe6fc" stroke="#d1bce9"/><text x="623" y="524" fill="#69438c" font-size="19" font-weight="700">Flower server</text><text x="623" y="551" fill="#7a638e" font-size="16">FedAvg over RL weights</text>
    <text x="580" y="435" fill="#526d84" font-size="14">Weights, not raw shards</text>
    <text x="1020" y="433" fill="#526d84" font-size="15">Operator corrections can update</text><text x="1020" y="456" fill="#526d84" font-size="15">the live learner and trigger a sync.</text>
    <text x="1000" y="578" fill="#526d84" font-size="15">Research prototype · local processes by default</text>
    <text x="1000" y="603" fill="#526d84" font-size="15">No secure aggregation or differential privacy</text>
  </g>
</svg>
