<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="440" viewBox="0 0 1440 440" role="img" aria-labelledby="title desc">
  <title id="title">Privacy-Preserving Federated and Reinforcement Learning-Based Intrusion Detection System for IoT Devices</title>
  <desc id="desc">P.R.I.S.M — CSE 499 final-year capstone project. XGBoost, five local RL classifiers, and Flower federated training.</desc>
